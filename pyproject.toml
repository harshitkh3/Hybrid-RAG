[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Modular Hybrid RAG API with Pinecone, Google Vertex AI, BM25, and FastAPI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "pinecone>=5.0.0",
    "pinecone-text>=0.9.0",
    "pypdf>=4.0.0",
]
